name: Update Contribution Heatmap

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # manual trigger via button / API

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch contribution data
        env:
          GH_PROFILE_USER: pv2004
        run: python Github/scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python Github/scripts/render_heatmap_svg.py

      - name: Copy SVG to repo root
        run: cp Github/contrib-heatmap.svg contrib-heatmap.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg Github/contrib-heatmap.svg Github/data/contributions.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh contribution heatmap"
          git push
